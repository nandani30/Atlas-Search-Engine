<div style="max-width:680px; padding:2rem 0;">
  <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:2rem;">
    <i class="ti ti-atom" style="font-size:36px; color:var(--text-accent); margin-bottom:8px;" aria-hidden="true"></i>
    <span style="font-weight:500; font-size:24px;">Atlas</span>
    <span style="font-size:13px; color:var(--text-secondary); margin-top:4px;">Search learning, science, and news</span>
  </div>

  <div style="max-width:480px; margin:0 auto 8px;">
    <div style="position:relative;">
      <input type="text" placeholder="Search learning, science, or news" style="width:100%; padding-left:36px;" value="quant" />
      <i class="ti ti-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>
    <div style="background:var(--surface-3); border:0.5px solid var(--border); border-radius:var(--radius); margin-top:4px; overflow:hidden;">
      <div style="padding:8px 12px; font-size:14px; display:flex; align-items:center; gap:8px; background:var(--surface-1);">
        <i class="ti ti-search" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
        <span><b>quant</b>um computing</span>
      </div>
      <div style="padding:8px 12px; font-size:14px; display:flex; align-items:center; gap:8px;">
        <i class="ti ti-search" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
        <span><b>quant</b>um entanglement</span>
      </div>
      <div style="padding:8px 12px; font-size:14px; display:flex; align-items:center; gap:8px;">
        <i class="ti ti-search" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
        <span><b>quant</b>um mechanics</span>
      </div>
      <div style="padding:8px 12px; font-size:14px; display:flex; align-items:center; gap:8px;">
        <i class="ti ti-search" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
        <span><b>quant</b>ity theory of money</span>
      </div>
    </div>
  </div>

  <div style="max-width:480px; margin:2rem auto 0;">
    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 8px; text-align:center;">Try searching</p>
    <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:1.5rem;">
      <span style="font-size:12px; background:var(--surface-1); padding:4px 10px; border-radius:12px;">solar eclipse</span>
      <span style="font-size:12px; background:var(--surface-1); padding:4px 10px; border-radius:12px;">french revolution</span>
      <span style="font-size:12px; background:var(--surface-1); padding:4px 10px; border-radius:12px;">artificial intelligence</span>
      <span style="font-size:12px; background:var(--surface-1); padding:4px 10px; border-radius:12px;">renewable energy</span>
    </div>

    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 8px; text-align:center;">Trending searches</p>
    <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
      <span style="font-size:12px; background:var(--bg-accent); color:var(--text-accent); padding:4px 10px; border-radius:12px;"><i class="ti ti-flame" style="font-size:12px; margin-right:3px; vertical-align:-1px;" aria-hidden="true"></i>mars rover</span>
      <span style="font-size:12px; background:var(--bg-accent); color:var(--text-accent); padding:4px 10px; border-radius:12px;"><i class="ti ti-flame" style="font-size:12px; margin-right:3px; vertical-align:-1px;" aria-hidden="true"></i>climate summit</span>
      <span style="font-size:12px; background:var(--bg-accent); color:var(--text-accent); padding:4px 10px; border-radius:12px;"><i class="ti ti-flame" style="font-size:12px; margin-right:3px; vertical-align:-1px;" aria-hidden="true"></i>black holes</span>
    </div>
  </div>
</div>
