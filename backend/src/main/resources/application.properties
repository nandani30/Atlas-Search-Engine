server.port=8080
spring.application.name=atlas-search-engine

# Turso/libSQL Database Configuration
spring.datasource.url=jdbc:dbeaver:libsql:${TURSO_DATABASE_URL}
spring.datasource.username=
spring.datasource.password=${TURSO_AUTH_TOKEN}
spring.datasource.driver-class-name=com.dbeaver.jdbc.driver.libsql.LibSqlDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
